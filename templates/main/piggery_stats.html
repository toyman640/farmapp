{% extends 'main/base.html' %}
{% load static %}

{% block title %}Piggery Statistics{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-fluid">
    <!-- Breadcrumbs-->
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="#">Dashboard</a>
      </li>
      <li class="breadcrumb-item active">Piggery Statistics</li>
      </ol>
    <h3 class="mb-4">🐖 Piggery Statistics</h3>

    <div class="box_general padding_bottom pb-0 bg-light">

      <!-- Census Chart -->
      <div class="mb-5">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h5>Census Records</h5>
          <form method="get" id="censusViewForm">
            <!-- Preserve existing event type parameter if selected -->
            <input type="hidden" name="type" value="{{ selected_type }}">
            <select name="census_view" onchange="this.form.submit()" class="form-control" style="width: 250px;">
              <option value="progressive" {% if selected_census_view == 'progressive' %}selected{% endif %}>Progressive (All Weekly Records)</option>
              <option value="monthly_last" {% if selected_census_view == 'monthly_last' %}selected{% endif %}>Last Record of Each Month</option>
            </select>
          </form>
        </div>
        <canvas id="censusChart" height="100"></canvas>
      </div>
    </div>

    <div class="box_general padding_bottom pb-0 bg-light">

      <!-- Event Chart -->
      <div>
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h5>Events by Month</h5>
          <form method="get" id="eventViewForm">
            <!-- Preserve existing census view parameter if selected -->
            <input type="hidden" name="census_view" value="{{ selected_census_view }}">
            <select name="type" onchange="this.form.submit()" class="form-control" style="width: 200px;">
              <option value="mortality" {% if selected_type == 'mortality' %}selected{% endif %}>Mortality</option>
              <option value="farrowing" {% if selected_type == 'farrowing' %}selected{% endif %}>Farrowing</option>
              <option value="breeding" {% if selected_type == 'breeding' %}selected{% endif %}>Breeding</option>
              <option value="culling" {% if selected_type == 'culling' %}selected{% endif %}>Culling</option>
            </select>
          </form>
        </div>
        <canvas id="eventChart" height="100"></canvas>
      </div>
    </div>
  
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const censusCtx = document.getElementById('censusChart');
new Chart(censusCtx, {
  type: 'bar',
  data: {
    labels: {{ census_labels|safe }},
    datasets: [
      {
        label: 'General',
        data: {{ adult_values|safe }},
        backgroundColor: 'rgba(75, 192, 192, 0.6)',
      },
      {
        label: 'Piglets',
        data: {{ piglet_values|safe }},
        backgroundColor: 'rgba(255, 159, 64, 0.6)',
      }
    ]
  },
  options: {
    responsive: true,
    scales: {
      y: { 
        beginAtZero: true,
        title: { display: true, text: 'Number of Animals' }
      },
      x: {
        title: { display: true, text: 'Census Date' }
      }
    }
  }
});

const eventCtx = document.getElementById('eventChart');
new Chart(eventCtx, {
  type: 'bar',
  data: {
    labels: {{ event_labels|safe }},
    datasets: [{
      label: '{{ selected_type|title }} Events',
      data: {{ event_values|safe }},
      backgroundColor: 'rgba(75, 192, 192, 0.6)',
    }]
  }
});
</script>
{% endblock %}
