{% extends 'main/base.html' %}
{% load static %}
{% block title %}Drugs Records{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-fluid">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="{% url 'main:main_index' %}">Dashboard</a>
      </li>
      <li class="breadcrumb-item active">Drugs records</li>
    </ol>

    <div class="box_general padding_bottom">
      <div class="d-flex justify-content-between mb-2">
        <h2 class="text-primary">Drug Inventory</h2>
        <input type="text" id="searchInput" placeholder="Search drug name..." class="form-control w-25">
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead class="thead-dark">
            <tr>
              <th><a href="#" class="sort-header" data-sort="manufacturer_name">Drug Manufacturer <span class="sort-icon" data-field="manufacturer_name"></span></a></th>
              <th><a href="#" class="sort-header" data-sort="drug_name">Drug Name <span class="sort-icon" data-field="drug_name"></span></a></th>
              <th><a href="#" class="sort-header" data-sort="batch_number">Batch Number <span class="sort-icon" data-field="batch_number"></span></a></th>
              <th><a href="#" class="sort-header" data-sort="quantity">Quantity <span class="sort-icon" data-field="quantity"></span></a></th>
              <th><a href="#" class="sort-header" data-sort="expiry_date">Expiry Date <span class="sort-icon" data-field="expiry_date"></span></a></th>
            </tr>
          </thead>
          <tbody id="drugTableBody">
            <tr><td colspan="5" class="text-center">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center" id="paginationLinks"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
let currentSort = 'entered_at';
let currentOrder = 'desc';
let currentPage = 1;

function updateSortIcons() {
  document.querySelectorAll('.sort-icon').forEach(icon => {
    const field = icon.getAttribute('data-field');
    if (field === currentSort) {
      icon.textContent = currentOrder === 'asc' ? '▲' : '▼';
    } else {
      icon.textContent = '';
    }
  });
}

function fetchDrugData() {
  const search = document.getElementById('searchInput').value;
  fetch(`/admin-page/drugs-inventory-lazy/?sort=${currentSort}&order=${currentOrder}&page=${currentPage}&search=${search}`)
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById('drugTableBody');
      tbody.innerHTML = '';

      if (data.results.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No drug records found.</td></tr>';
        return;
      }

      data.results.forEach(d => {
        tbody.innerHTML += `
          <tr onclick="window.location.href='/admin-page/drug/${d.id}/details';" style="cursor: pointer;">
            <td>${d.manufacturer_name}</td>
            <td>${d.drug_name}</td>
            <td>${d.batch_number}</td>
            <td>${d.quantity}</td>
            <td>${d.expiry_date}</td>
          </tr>
        `;
      });

      const pagination = document.getElementById('paginationLinks');
      pagination.innerHTML = '';

      if (data.current_page > 1) {
        pagination.innerHTML += `<li class="page-item"><a href="#" class="page-link" onclick="changePage(1)">&laquo;&laquo;</a></li>`;
        pagination.innerHTML += `<li class="page-item"><a href="#" class="page-link" onclick="changePage(${data.current_page - 1})">&laquo;</a></li>`;
      }

      pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">Page ${data.current_page} of ${data.total_pages}</span></li>`;

      if (data.has_next) {
        pagination.innerHTML += `<li class="page-item"><a href="#" class="page-link" onclick="changePage(${data.current_page + 1})">&raquo;</a></li>`;
        pagination.innerHTML += `<li class="page-item"><a href="#" class="page-link" onclick="changePage(${data.total_pages})">&raquo;&raquo;</a></li>`;
      }

      updateSortIcons();
    });
}

function changePage(page) {
  currentPage = page;
  fetchDrugData();
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentPage = 1;
  fetchDrugData();
});

document.querySelectorAll('.sort-header').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const sortField = this.getAttribute('data-sort');
    if (sortField === currentSort) {
      currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort = sortField;
      currentOrder = 'asc';
    }
    currentPage = 1;
    fetchDrugData();
  });
});

document.addEventListener('DOMContentLoaded', fetchDrugData);
</script>
{% endblock %}
