{% extends 'vet/base.html' %}
{% load static %}
{% block title %}New Census{% endblock %}

{% block content %}
<div class="content-wrapper census-page">
  <div class="container-fluid">

    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a href="{% url 'veterinary:vet_index' %}">Home</a>
      </li>
      <li class="breadcrumb-item active">New Census</li>
    </ol>

    <div class="p-4 shadow-sm rounded bg-white">
      <h4 class="text-primary mb-3">
        New Census for {{ form.animal.value|title }}
      </h4>

      <form method="post" id="census-form">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- IMPORTANT: still needed for Django formset -->
        {{ formset.management_form }}

        <!-- ================= INPUT ROW ================= -->
        <div class="row mb-3">
          <div class="col-md-5">
            <label>Animal Type</label>
            <select id="animalTypeSelect" class="form-control">
              <option value="">--- Select ---</option>
              {% for opt in formset.empty_form.fields.animal_type.queryset %}
                <option value="{{ opt.id }}">{{ opt.animal_type_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-5">
            <label>Number</label>
            <input type="number" id="animalCountInput" class="form-control">
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="button" id="addRecordBtn" class="btn btn-success w-100">
              Add
            </button>
          </div>
        </div>

        <!-- ================= STACKED RECORDS ================= -->
        <div id="recordsContainer" class="mb-3"></div>

        <!-- ================= SUBMIT ================= -->
        <div class="text-end">
          <button type="submit" class="btn btn-primary px-4">
            Save Census
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const select = document.getElementById("animalTypeSelect");
  const input  = document.getElementById("animalCountInput");
  const addBtn = document.getElementById("addRecordBtn");
  const container = document.getElementById("recordsContainer");
  const totalForms = document.querySelector('[name="records-TOTAL_FORMS"]');

  let records = [];

  // ---------------- ADD RECORD ----------------
  addBtn.addEventListener("click", () => {
    const typeId = select.value;
    const typeText = select.options[select.selectedIndex]?.text;
    const count = input.value;

    if (!typeId || !count) {
      alert("Select animal type and enter number");
      return;
    }

    // prevent duplicate selection
    if (records.some(r => r.typeId === typeId)) {
      alert("This animal type already added");
      return;
    }

    records.push({ typeId, typeText, count });

    renderRecords();
    updateSelectOptions();

    // reset inputs
    select.value = "";
    input.value = "";
  });

  // ---------------- DELETE RECORD ----------------
  function deleteRecord(index) {
    records.splice(index, 1);
    renderRecords();
    updateSelectOptions();
  }

  // ---------------- RENDER ----------------
  function renderRecords() {
    container.innerHTML = "";

    records.forEach((rec, index) => {
      const row = document.createElement("div");
      row.className = "d-flex justify-content-between align-items-center border p-2 mb-2 rounded";

      row.innerHTML = `
        <div>
          <strong>${rec.typeText}</strong> — ${rec.count}
        </div>
        <button type="button" class="btn btn-danger btn-sm">
          Delete
        </button>
      `;

      row.querySelector("button").onclick = () => deleteRecord(index);

      container.appendChild(row);
    });

    rebuildFormset();
  }

  // ---------------- FORMSET SYNC ----------------
  function rebuildFormset() {
    // remove old hidden inputs
    document.querySelectorAll(".hidden-formset").forEach(el => el.remove());

    records.forEach((rec, i) => {
      container.insertAdjacentHTML("beforeend", `
        <div class="hidden-formset d-none">
          <input type="hidden" name="records-${i}-animal_type" value="${rec.typeId}">
          <input type="hidden" name="records-${i}-number_of_animals" value="${rec.count}">
        </div>
      `);
    });

    totalForms.value = records.length;
  }

  // ---------------- OPTION FILTER ----------------
  let masterOptions = [];

  // store all options once
  Array.from(select.options).forEach(opt => {
    if (opt.value) {
      masterOptions.push({
        value: opt.value,
        text: opt.text
      });
    }
  });

  function updateSelectOptions() {
    const selected = records.map(r => r.typeId);

    // reset dropdown
    select.innerHTML = '<option value="">--- Select ---</option>';

    // rebuild only available options
    masterOptions.forEach(opt => {
      if (!selected.includes(opt.value)) {
        const option = document.createElement("option");
        option.value = opt.value;
        option.textContent = opt.text;
        select.appendChild(option);
      }
    });
  }

});
</script>

<style>
#recordsContainer div {
  background: #f8f9fa;
}
</style>

{% endblock %}
