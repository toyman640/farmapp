{% extends 'vet/base.html' %}
{% load static %}
{% block title %}Census{% endblock %}

{% block content %}
<div class="content-wrapper census-page">
  <div class="container-fluid">

    <div class="p-4 shadow-sm rounded bg-white">

      <h4 class="text-primary mb-3">
        {% if is_edit %}Edit Census{% else %}New Census{% endif %}
      </h4>

      <form method="post" id="census-form">
        {% csrf_token %}

        {{ form.as_p }}

        {{ formset.management_form }}

        <!-- INPUT AREA -->
        <div class="row mb-3">
          <div class="col-md-5">
            <label>Animal Type</label>
            <select id="animalTypeSelect" class="form-control">
              <option value="">--- Select ---</option>
              {% for opt in formset.empty_form.fields.animal_type.queryset %}
                <option value="{{ opt.id }}">{{ opt.animal_type_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-5">
            <label>Number</label>
            <input type="number" id="animalCountInput" class="form-control">
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="button" id="addRecordBtn" class="btn btn-success w-100">
              Add
            </button>
          </div>
        </div>

        <!-- RECORDS -->
        <div id="recordsContainer" class="mb-3"></div>

        <!-- SUBMIT -->
        <div class="text-end">
          <button type="submit" class="btn btn-primary px-4">
            {% if is_edit %}Update Census{% else %}Save Census{% endif %}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

{{ existing_records|json_script:"existing-records" }}

<script>
document.addEventListener("DOMContentLoaded", () => {

  const select = document.getElementById("animalTypeSelect");
  const input = document.getElementById("animalCountInput");
  const addBtn = document.getElementById("addRecordBtn");
  const container = document.getElementById("recordsContainer");
  const totalForms = document.querySelector('[name="records-TOTAL_FORMS"]');

  // ================= EXISTING RECORDS =================
  let records = JSON.parse(
    document.getElementById("existing-records").textContent
  ).map(r => ({
    id: r.id || null,
    typeId: r.typeId,
    typeText: r.typeText,
    count: r.count,
    _deleted: false // Track deletion state explicitly
  }));

  // ================= MASTER OPTIONS =================
  let masterOptions = [];
  Array.from(select.options).forEach(opt => {
    if (opt.value) {
      masterOptions.push({
        value: opt.value,
        text: opt.text
      });
    }
  });

  // ================= INITIAL LOAD =================
  renderRecords();
  updateSelectOptions();

  // ================= ADD RECORD =================
  addBtn.addEventListener("click", () => {
    const typeId = select.value;
    const typeText = select.options[select.selectedIndex]?.text;
    const count = input.value.trim();

    if (!typeId || !count) {
      alert("Select animal type and enter number");
      return;
    }

    // Check if the item exists but was previously flagged as deleted
    const hiddenMatch = records.find(r => String(r.typeId) === String(typeId));
    
    if (hiddenMatch) {
      if (hiddenMatch._deleted) {
        // Resurrect it instead of duplicating
        hiddenMatch._deleted = false;
        hiddenMatch.count = count;
      } else {
        alert("This animal type already added");
        return;
      }
    } else {
      records.push({
        id: null,
        typeId,
        typeText,
        count,
        _deleted: false
      });
    }

    renderRecords();
    updateSelectOptions();

    select.value = "";
    input.value = "";
    select.focus();
  });

  // ================= DELETE RECORD =================
  window.deleteRecord = function(index) {
    const rec = records[index];

    if (rec.id) {
      // Keep it in the array but flag it so Django gets the DELETE marker
      rec._deleted = true;
    } else {
      // If it was just added in UI and never saved, safe to drop completely
      records.splice(index, 1);
    }

    renderRecords();
    updateSelectOptions();
  }

  // ================= RENDER RECORDS =================
  function renderRecords() {
    container.innerHTML = "";

    records.forEach((rec, index) => {
      // Do not display items flagged as deleted in the layout list
      if (rec._deleted) return;

      const row = document.createElement("div");
      row.className = "d-flex justify-content-between align-items-center border p-3 mb-2 rounded";
      row.innerHTML = `
        <div>
          <strong>${rec.typeText}</strong> — ${rec.count}
        </div>
        <button type="button" class="btn btn-danger btn-sm" onclick="deleteRecord(${index})">
          Delete
        </button>
      `;

      container.appendChild(row);
    });

    rebuildFormset();
  }

  // ================= REBUILD FORMSET =================
  function rebuildFormset() {
    document.querySelectorAll(".hidden-formset").forEach(el => el.remove());

    records.forEach((rec, i) => {
      const wrapper = document.createElement("div");
      wrapper.classList.add("hidden-formset", "d-none");

      wrapper.innerHTML = `
        <input type="hidden" name="records-${i}-id" value="${rec.id || ''}">
        <input type="hidden" name="records-${i}-animal_type" value="${rec.typeId}">
        <input type="hidden" name="records-${i}-number_of_animals" value="${rec.count}">
        <input type="hidden" name="records-${i}-DELETE" value="${rec._deleted ? 'on' : ''}">
      `;

      document.getElementById("census-form").appendChild(wrapper);
    });

    // TOTAL_FORMS must accurately report the whole array length, including deleted ones
    totalForms.value = records.length;
  }

  // ================= UPDATE OPTIONS =================
  function updateSelectOptions() {
    // Only count active items as selected IDs
    const activeSelectedIds = records
      .filter(r => !r._deleted)
      .map(r => String(r.typeId));

    select.innerHTML = '<option value="">--- Select ---</option>';

    masterOptions.forEach(opt => {
      if (!activeSelectedIds.includes(String(opt.value))) {
        const option = document.createElement("option");
        option.value = opt.value;
        option.textContent = opt.text;
        select.appendChild(option);
      }
    });
  }
});
</script>

<style>
#recordsContainer div {
  background: #f8f9fa;
}
</style>

{% endblock %}
