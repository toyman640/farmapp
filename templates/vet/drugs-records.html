{% extends 'vet/base.html' %}
{% load crispy_forms_tags %}
{% load static %}
<!Doctype html>
{% block title %}
 Drug Records
{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-fluid">
    <!-- Breadcrumbs -->
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
      <li class="breadcrumb-item active">Drug Records</li>
    </ol>

    <div class="form-group">
      <input type="text" id="drug-search" class="form-control" placeholder="Search drug name...">
    </div>

    <div class="box_general padding_bottom">
      <h5 class="mb-3">💊 Recent Drug Records</h5>

      <div id="drug-list" class="table-responsive">
        <table class="table table-bordered table-striped w-100">
          <thead class="thead-dark">
            <tr>
              <th>Drug Name</th>
              <th>Batch Number</th>
              <th>Quantity</th>
              <th>Unit</th>
              <th>Entered At</th>
            </tr>
          </thead>
          <tbody id="drug-body">
            <!-- Rows will be loaded here -->
          </tbody>
        </table>
      </div>

      <div class="text-center mt-3">
        <button id="load-more" class="btn btn-primary" data-page="1">Load More</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const drugBody = document.getElementById('drug-body');
    const loadBtn = document.getElementById('load-more');
    const searchInput = document.getElementById('drug-search');

    let currentPage = 1;
    let currentSearch = "";
    let debounceTimeout;

    function clearTable() {
      drugBody.innerHTML = '';
      loadBtn.style.display = 'none';
    }

    function loadDrugs(page = 1, search = "") {
      fetch(`/skaal-vet-hub/lazy-drugs-records/?page=${page}&search=${encodeURIComponent(search)}`)
        .then(res => res.json())
        .then(data => {
          if (page === 1) drugBody.innerHTML = '';

          data.results.forEach(d => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${d.drug_name}</td>
              <td>${d.batch_number}</td>
              <td>${d.quantity}</td>
              <td>${d.unit}</td>
              <td>${d.entered_at}</td>
            `;
            drugBody.appendChild(row);
          });

          if (data.has_next) {
            loadBtn.style.display = 'inline-block';
            loadBtn.dataset.page = page + 1;
          } else {
            loadBtn.style.display = 'none';
          }
        });
    }

    loadDrugs(); // initial load

    loadBtn.addEventListener('click', () => {
      const nextPage = parseInt(loadBtn.dataset.page || "1");
      loadDrugs(nextPage, currentSearch);
    });

    searchInput.addEventListener('input', () => {
      const searchValue = searchInput.value.trim();
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        currentPage = 1;
        currentSearch = searchValue;
        loadDrugs(currentPage, currentSearch);
      }, 2000); // 2 seconds delay
    });
  });
</script>

{% endblock %}
