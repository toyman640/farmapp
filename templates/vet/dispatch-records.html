<script>
  document.addEventListener('DOMContentLoaded', function () {
    const dispatchBody = document.getElementById('dispatch-body');
    const loadBtn = document.getElementById('load-more');
    const searchInput = document.getElementById('dispatch-search');

    let currentPage = 1;
    let currentSearch = "";
    let debounceTimeout;

    function clearTable() {
      dispatchBody.innerHTML = '';
      loadBtn.style.display = 'none';
    }

    function loadDispatches(page = 1, search = "") {
      fetch(`/skaal-vet-hub/lazy-dispatched-drugs/?page=${page}&search=${encodeURIComponent(search)}`)
        .then(res => res.json())
        .then(data => {
          if (page === 1) dispatchBody.innerHTML = ''; // Reset if new search
          
          data.results.forEach(d => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td data-label="Drug">${d.drug}</td>
              <td data-label="Quantity">${d.quantity}</td>
              <td data-label="Unit">${d.unit}</td>
              <td data-label="Dispatched At">${d.dispatched_at}</td>
            `;
            dispatchBody.appendChild(row);
          });

          if (data.has_next) {
            loadBtn.style.display = 'inline-block';
            loadBtn.dataset.page = page + 1;
          } else {
            loadBtn.style.display = 'none';
          }
        });
    }

    // Initial load
    loadDispatches();

    loadBtn.addEventListener('click', () => {
      const nextPage = parseInt(loadBtn.dataset.page || "1");
      loadDispatches(nextPage, currentSearch);
    });

    // Debounced search
    searchInput.addEventListener('input', () => {
      const searchValue = searchInput.value.trim();
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(() => {
        currentPage = 1;
        currentSearch = searchValue;
        loadDispatches(currentPage, currentSearch);
      }, 2000); // 2 seconds delay
    });
  });
</script>
